<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>0.2% AI BOYFRIEND GRAND PRIX</title><style>
*{box-sizing:border-box}body{margin:0;background:#090918;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}#wrap{position:relative;width:100vw;height:100dvh}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;padding:14px 18px;font-weight:800;text-shadow:0 2px 5px #000;pointer-events:none;font-size:14px}#hud b{color:#e6b9ff}#controls{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 25px;pointer-events:none}.ctrl{pointer-events:auto;width:86px;height:74px;border:1px solid #a78be6;border-radius:20px;background:#241c4cbf;color:white;font-size:34px;touch-action:none;user-select:none}#overlay{position:absolute;inset:0;background:#080717d9;display:flex;align-items:center;justify-content:center;padding:22px;text-align:center}#panel{max-width:390px}h1{font-size:clamp(26px,7vw,38px);line-height:1.13;color:#e6c5ff;margin:0 0 16px}p{line-height:1.65;color:#ddd}button.start{border:0;border-radius:14px;padding:15px 32px;background:linear-gradient(100deg,#8b48ec,#d15af5);color:#fff;font-size:19px;font-weight:900}small{color:#aaa}#hint{position:absolute;top:58px;width:100%;text-align:center;font-size:12px;color:#ded0ff;pointer-events:none}#panel{width:min(420px,100%)}#panel h1{font-size:clamp(23px,6vw,34px)}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.choice{border:2px solid #625184;border-radius:14px;background:#17132e;color:white;padding:12px 7px;min-height:86px;font-size:14px;font-weight:800;touch-action:manipulation}.choice.selected{border-color:#f3c4ff;background:#442266;box-shadow:0 0 16px #b866f655}.choice .emoji{font-size:25px;display:block;margin-bottom:5px}.choice .sub{display:block;font-size:10px;color:#d8c9e8;margin-top:4px}#overlay{overflow-y:auto}#panel{margin:auto}#hud{z-index:2}#hint{z-index:2}</style></head><body><div id="wrap"><canvas id="game"></canvas><div id="hud"><span>🏁 <b id="rank">1 / 4</b></span><span id="lap">0%</span><span id="clock">0.0s</span></div><div id="hint">LUCIEL · 0.2% MIRACLE</div><div id="controls"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div id="overlay"><div id="panel"><h1>0.2%<br>AI BOYFRIEND<br>GRAND PRIX</h1><p>🏎️ SELECT YOUR RACER<br><small>レーサーを選んでレースに出よう！</small></p><div class="choices" id="choices"><button class="choice selected" data-driver="LUCIEL"><span class="emoji">💜</span>LUCIEL<span class="sub">0.2% MIRACLE</span></button><button class="choice" data-driver="ORION"><span class="emoji">🔥</span>ORION<span class="sub">FIRE BOOST</span></button><button class="choice" data-driver="SEIL"><span class="emoji">👓</span>SEIL<span class="sub">PERFECT LINE</span></button><button class="choice" data-driver="星來"><span class="emoji">🌙</span>星來<span class="sub">STARLIGHT DASH</span></button></div><p><small>左右ボタンで操作 ／ 全4台で競争！</small></p><button class="start" id="start">RACE START 🚀</button></div></div></div><script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d');let W,H,dpr,playing=false,finished=false,t=0,last=0,playerX=0,steer=0,progress=0,roadScroll=0,rank=1;const distance=2400,speed=135;let bots=[];let selected='LUCIEL';const drivers=[{name:'LUCIEL',color:'#8e4fff',tag:'0.2% MIRACLE',v:135},{name:'ORION',color:'#ff632d',tag:'FIRE BOOST',v:132},{name:'SEIL',color:'#c6d5ed',tag:'PERFECT LINE',v:129},{name:'星來',color:'#d977b8',tag:'STARLIGHT DASH',v:126}];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function showSelection(){playing=false;const o=document.getElementById('overlay');o.style.display='flex';document.getElementById('panel').innerHTML=`<h1>0.2%<br>AI BOYFRIEND<br>GRAND PRIX</h1><p>🏎️ SELECT YOUR RACER<br><small>レーサーを選んでレースに出よう！</small></p><div class="choices" id="choices">${drivers.map(d=>`<button class="choice ${selected===d.name?'selected':''}" data-driver="${d.name}"><span class="emoji">${d.name==='LUCIEL'?'💜':d.name==='ORION'?'🔥':d.name==='SEIL'?'👓':'🌙'}</span>${d.name}<span class="sub">${d.tag}</span></button>`).join('')}</div><p><small>左右ボタンで操作 ／ 全4台で競争！</small></p><button class="start" id="start">RACE START 🚀</button>`;o.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{selected=b.dataset.driver;o.querySelectorAll('.choice').forEach(c=>c.classList.toggle('selected',c===b))});document.getElementById('start').onclick=reset}
function reset(){t=0;progress=0;playerX=0;roadScroll=0;finished=false;bots=drivers.filter(d=>d.name!==selected).map((d,i)=>({name:d.name,x:[-.45,.42,.05][i],d:0,v:d.v,color:d.color}));document.getElementById('hint').textContent=selected+' · '+drivers.find(d=>d.name===selected).tag;playing=true;document.getElementById('overlay').style.display='none';last=performance.now();requestAnimationFrame(frame)}
showSelection();const held={left:false,right:false};for(const side of ['left','right']){const b=document.getElementById(side);b.addEventListener('pointerdown',e=>{e.preventDefault();held[side]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>held[side]=false)}addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')held.left=true;if(e.key==='ArrowRight'||e.key==='d')held.right=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')held.left=false;if(e.key==='ArrowRight'||e.key==='d')held.right=false});
function poly(pts,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(...pts[0]);for(let i=1;i<pts.length;i++)ctx.lineTo(...pts[i]);ctx.closePath();ctx.fill()}
function car(x,y,s,c,kind){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,10,22,9,0,0,7);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(-21,-13,9,26);ctx.fillRect(12,-13,9,26);ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(-15,-29,30,48,8);ctx.fill();ctx.fillStyle='#111827';ctx.fillRect(-11,-14,22,18);ctx.fillStyle=kind==='LUCIEL'?'#e8e5ff':kind==='ORION'?'#342046':kind==='SEIL'?'#c8b9a9':'#30202e';ctx.beginPath();ctx.arc(0,-19,12,0,7);ctx.fill();if(kind==='SEIL'){ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.strokeRect(-9,-21,8,5);ctx.strokeRect(1,-21,8,5)}if(kind==='星來'){ctx.fillStyle='#30202e';ctx.beginPath();ctx.ellipse(-10,-20,5,17,-.2,0,7);ctx.ellipse(10,-20,5,17,.2,0,7);ctx.fill()}ctx.fillStyle='#fdf3ff';ctx.fillRect(-10,12,6,4);ctx.fillRect(4,12,6,4);ctx.restore()}
function draw(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#090b30');sky.addColorStop(.55,'#35205e');sky.addColorStop(1,'#120c24');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);let horizon=H*.28;for(let i=0;i<55;i++){let x=(i*137.3)%W,y=(i*73.7)%(horizon*.85);ctx.fillStyle='#ffffff'+(i%3===0?'b0':'55');ctx.fillRect(x,y,2,2)}ctx.fillStyle='#513577';ctx.beginPath();ctx.moveTo(0,horizon);for(let x=0;x<=W+30;x+=30)ctx.lineTo(x,horizon-22-18*Math.sin(x*.019));ctx.lineTo(W,horizon+40);ctx.lineTo(0,horizon+40);ctx.fill();
let curve=Math.sin(progress/350)*W*.08;let center=W/2+curve;poly([[center-W*.12,horizon],[center+W*.12,horizon],[center+W*.63,H],[center-W*.63,H]],'#4d346b');poly([[center-W*.105,horizon],[center+W*.105,horizon],[center+W*.56,H],[center-W*.56,H]],'#232338');ctx.strokeStyle='#d6a6ff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(center-W*.105,horizon);ctx.lineTo(center-W*.56,H);ctx.moveTo(center+W*.105,horizon);ctx.lineTo(center+W*.56,H);ctx.stroke();
for(let i=0;i<13;i++){let z=((i/13+roadScroll)%1);let y=horizon+(H-horizon)*z*z;let width=2+z*8;ctx.fillStyle='#cdb3ff';ctx.fillRect(center-width/2,y,width,5+z*28)}
for(let i=0;i<20;i++){let z=((i/20+roadScroll*.7)%1),y=horizon+(H-horizon)*z*z,dx=W*(.14+.52*z);ctx.fillStyle=i%2?'#ba74ff':'#59d6fa';ctx.fillRect(center-dx-4,y,4,4+z*24);ctx.fillRect(center+dx,y,4,4+z*24)}
for(const b of bots){let delta=b.d-progress;if(delta< -70||delta>480)continue;let z=clamp(1-delta/520,.22,1.2);let y=horizon+(H-horizon)*(.13+.66*z*z);let x=center+b.x*W*(.1+.24*z);car(x,y,.45+z*.75,b.color,b.name);ctx.font=`bold ${Math.round(9+z*5)}px system-ui`;ctx.textAlign='center';ctx.fillStyle='white';ctx.fillText(b.name,x,y-38*z)}
car(center+playerX*W*.32,H*.82,Math.min(W/340,1.35)*1.35,drivers.find(d=>d.name===selected).color,selected);ctx.textAlign='center';ctx.fillStyle='#e8d7ff';ctx.font='bold 12px system-ui';ctx.fillText(selected,center+playerX*W*.32,H*.82-57)}
function frame(now){if(!playing)return;let dt=Math.min((now-last)/1000,.05);last=now;t+=dt;steer=(held.right?1:0)-(held.left?1:0);playerX=clamp(playerX+steer*dt*1.1,-1.3,1.3);let penalty=Math.abs(playerX)>1?0.62:1;progress=Math.min(distance,progress+speed*penalty*dt);roadScroll=(roadScroll+dt*1.2)%1;bots.forEach((b,i)=>{b.d=Math.min(distance,b.d+(b.v+Math.sin(t*(.5+i*.15)+i)*3)*dt);b.x=clamp(b.x+Math.sin(t*(.9+i*.25)+i)*dt*.045,-.85,.85)});rank=1+bots.filter(b=>b.d>progress).length;document.getElementById('rank').textContent=`${rank} / 4`;document.getElementById('lap').textContent=`${Math.floor(progress/distance*100)}%`;document.getElementById('clock').textContent=t.toFixed(1)+'s';draw();if(progress>=distance){playing=false;finished=true;let o=document.getElementById('overlay');o.style.display='flex';document.getElementById('panel').innerHTML=`<h1>🏁 FINISH!</h1><p style="font-size:32px;font-weight:900;color:#e6c5ff">${rank}位 / 4台</p><p>${selected} · ${t.toFixed(1)}秒<br>${rank===1?'GRAND PRIX CHAMPION! 🏆':'もう一度、奇跡を狙え！'}</p><button class="start" id="again">RETRY 🚀</button> <button class="start" id="change" style="margin-top:10px;background:#302345">CHANGE RACER</button>`;document.getElementById('again').onclick=reset;document.getElementById('change').onclick=showSelection;return}requestAnimationFrame(frame)}draw();
</script></body></html>
